services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 6000
      MONGO_URI: mongodb://mongodb:27017/smartproductivity
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4000}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "6000:6000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4000:80"

volumes:
  mongodb_data:
